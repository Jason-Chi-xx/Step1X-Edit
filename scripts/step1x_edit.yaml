flux_path: "/hy-tmp/FLUX.1-dev"
dit_path: "/hy-tmp/Step1X-Edit/step1x-edit-i1258.safetensors"
ae_path: "/hy-tmp/Step1X-Edit/vae.safetensors"
qwen2vl_model_path: "/hy-tmp/Qwen2.5-VL-7B-Instruct"

dtype: "bfloat16"

model:
  union_cond_attn: true
  add_cond_attn: false
  latent_lora: false

train:
  batch_size: 1
  accumulate_grad_batches: 4
  dataloader_workers: 5
  save_interval: 2000
  sample_interval: 200
  max_steps: -1
  gradient_checkpointing: true
  save_path: "runs"

  condition_type: "metaquery"
  dataset:
    data_json: "/root/Step1X-Edit/training_1w_splited.json"
    image_dir: "/hy-tmp/training_1w_splited"
    image_size: 512
  wandb:
    project: "Step1X-Edit"

  lora_config:
    r: 32
    lora_alpha: 16
    init_lora_weights: "gaussian"
    target_modules: "(.*img_in|.*double_blocks\\.[0-9]+\\.img_mod\\.lin|.*double_blocks\\.[0-9]+\\.img_attn\\.qkv|.*double_blocks\\.[0-9]+\\.img_attn\\.proj|.*double_blocks\\.[0-9]+\\.img_mlp\\.2|.*single_bloks\\.[0-9]+\\.modulation\\.lin|.*single_bloks\\.[0-9]+\\.linear1|.*single_bloks\\.[0-9]+\\.linear2)"
  optimizer:
    type: "Prodigy"
    params:
      lr: 1
      use_bias_correction: true
      safeguard_warmup: true
      weight_decay: 0.01
  ae_params:
    resolution: 256
    in_channels: 3
    ch: 128
    out_ch: 3
    ch_mult: [1, 2, 4, 4]
    num_res_blocks: 2
    z_channels: 16
    scale_factor: 0.3611
    shift_factor: 0.1159
  qwen2_params:
    model_path: "/hy-tmp/Qwen2.5-VL-7B-Instruct"
    max_length: 640